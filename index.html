<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opcit – Mes tâches</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="credits">Opcit · Liste de tâches</header>

  <main class="carte">
    <h1>📝 Mes tâches</h1>

    <form id="formulaire">
      <input id="saisie" type="text" placeholder="Ajouter une tâche..." autocomplete="off" required>
      <button type="submit">Ajouter</button>
    </form>

    <div class="filtres">
      <button data-filtre="toutes" class="actif">Toutes</button>
      <button data-filtre="actives">À faire</button>
      <button data-filtre="terminees">Terminées</button>
    </div>

    <ul id="liste"></ul>

    <footer>
      <span id="compteur">0 tâche restante</span>
      <div class="actions-pied">
        <button type="button" id="annuler" hidden>Annuler</button>
        <button type="button" id="tout-terminer">Tout terminer</button>
        <button type="button" id="effacer">Effacer les terminées</button>
      </div>
    </footer>
  </main>

  <footer class="credits">@Dona By - Shikazawa</footer>

  <script src="js/messages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
